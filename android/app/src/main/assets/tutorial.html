<h1>操作教程</h1>
<h2>1. 复制链接</h2><p>在抖音 / 快手 / 小红书 / B站点「分享」→「复制链接」。</p>
<h2>2. 粘贴解析</h2><p>打开「一键去水印」，链接会自动填入，点「立即开始解析」。</p>
<h2>3. 保存</h2><p>解析完成后点「保存视频」，文件在相册里。</p>
<h2>4. 本地处理</h2><p>去背景音乐、提取音频、音频转换都在本机用 FFmpeg 完成。</p>
